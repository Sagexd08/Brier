<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1060 600" width="1060" height="600" font-family="CMU Serif, Latin Modern Roman, Georgia, serif">
  <!--
    Figure B - protocol sequence with measured gas per step.

    Replaces a Mermaid render that had drifted out of date: it labelled the
    resolver "v0: single admin key" and carried a "v0 GAP: nothing prevents
    withdraw()" note, both of which describe behaviour the N-of-M committee and
    the unbonding delay have since changed. The PNG had no generator script, so
    nothing caught the drift -- which is the argument for keeping figures in
    version-controlled source rather than as exported images.

    Styling follows figures A and C: Computer Modern, no in-figure title,
    colour only where it carries the paper's negative results.
  -->
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9.2" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto-start-reverse">
      <path d="M 0 1.4 L 9 5 L 0 8.6 z" fill="#1c1c1c"/>
    </marker>
    <marker id="aR" viewBox="0 0 10 10" refX="9.2" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.4 L 9 5 L 0 8.6 z" fill="#a4341f"/>
    </marker>
  </defs>

  <rect width="1060" height="600" fill="#ffffff"/>

  <!-- ================= participants ================= -->
  <g font-size="11.5" text-anchor="middle" fill="#1c1c1c">
    <rect x="26"  y="16" width="118" height="34" fill="#ffffff" stroke="#1c1c1c" stroke-width="1"/>
    <text x="85"  y="30" font-weight="bold">Model operator</text>
    <text x="85"  y="44" font-size="10.5" fill="#6e6e6e">off-chain</text>

    <rect x="182" y="16" width="112" height="34" fill="#ffffff" stroke="#a4341f" stroke-width="1.4"/>
    <text x="238" y="30" font-weight="bold">EZKL prover</text>
    <text x="238" y="44" font-size="10.5" fill="#6e6e6e">halo2, off-chain</text>

    <rect x="332" y="16" width="112" height="34" fill="#ffffff" stroke="#1c1c1c" stroke-width="1"/>
    <text x="388" y="30" font-weight="bold">Attestation</text>
    <text x="388" y="44" font-size="10.5" fill="#6e6e6e">on-chain</text>

    <rect x="482" y="16" width="112" height="34" fill="#ffffff" stroke="#1c1c1c" stroke-width="1"/>
    <text x="538" y="30" font-weight="bold">Halo2Verifier</text>
    <text x="538" y="44" font-size="10.5" fill="#6e6e6e">on-chain</text>

    <rect x="632" y="16" width="112" height="34" fill="#ffffff" stroke="#1c1c1c" stroke-width="1"/>
    <text x="688" y="30" font-weight="bold">StakePool</text>
    <text x="688" y="44" font-size="10.5" fill="#6e6e6e">on-chain</text>

    <rect x="782" y="16" width="92" height="34" fill="#ffffff" stroke="#1c1c1c" stroke-width="1"/>
    <text x="828" y="30" font-weight="bold">Claimant</text>

    <rect x="912" y="16" width="124" height="34" fill="#ffffff" stroke="#1c1c1c" stroke-width="1" stroke-dasharray="5 3"/>
    <text x="974" y="30" font-weight="bold">Resolvers</text>
    <text x="974" y="44" font-size="10.5" fill="#a4341f">N-of-M, tier 3</text>
  </g>

  <!-- ================= lifelines ================= -->
  <g stroke="#bfbfbf" stroke-width="0.8" stroke-dasharray="3 3">
    <line x1="85"  y1="50" x2="85"  y2="560"/>
    <line x1="238" y1="50" x2="238" y2="560"/>
    <line x1="388" y1="50" x2="388" y2="560"/>
    <line x1="538" y1="50" x2="538" y2="560"/>
    <line x1="688" y1="50" x2="688" y2="560"/>
    <line x1="828" y1="50" x2="828" y2="560"/>
    <line x1="974" y1="50" x2="974" y2="560"/>
  </g>

  <!-- ================= phase 1: stake and score ================= -->
  <text x="26" y="78" font-size="10.5" fill="#6e6e6e" letter-spacing="0.5">STAKE AND SCORE</text>
  <line x1="26" y1="84" x2="1036" y2="84" stroke="#dcdcdc" stroke-width="0.7"/>

  <line x1="85" y1="102" x2="682" y2="102" stroke="#1c1c1c" stroke-width="1" marker-end="url(#a)"/>
  <text x="380" y="97" font-size="11" fill="#1c1c1c" text-anchor="middle">stake()</text>
  <text x="676" y="97" font-size="10.5" fill="#6e6e6e" text-anchor="end">45,443 gas</text>

  <path d="M 85 118 L 128 118 L 128 134 L 90 134" fill="none" stroke="#1c1c1c" stroke-width="1" marker-end="url(#a)"/>
  <text x="136" y="124" font-size="11" fill="#1c1c1c">base classifier emits the logit&#160;<tspan font-style="italic">L</tspan></text>
  <text x="136" y="138" font-size="11" fill="#a4341f">neither proved nor committed &#8212; the tier-1 boundary (&#167;8.1)</text>

  <path d="M 85 156 L 128 156 L 128 172 L 90 172" fill="none" stroke="#1c1c1c" stroke-width="1" marker-end="url(#a)"/>
  <text x="136" y="166" font-size="11" fill="#1c1c1c">calibration head:&#160;<tspan font-style="italic">c</tspan> = &#963;(<tspan font-style="italic">L</tspan>/<tspan font-style="italic">T</tspan>), T = 3.01&#160;&#160;&#183;&#160;&#160;SHAP top-5 &#8594; keccak256</text>

  <!-- ================= phase 2: prove and attest ================= -->
  <text x="26" y="204" font-size="10.5" fill="#6e6e6e" letter-spacing="0.5">PROVE AND ATTEST</text>
  <line x1="26" y1="210" x2="1036" y2="210" stroke="#dcdcdc" stroke-width="0.7"/>

  <line x1="85" y1="228" x2="232" y2="228" stroke="#a4341f" stroke-width="1.4" marker-end="url(#aR)"/>
  <text x="158" y="223" font-size="11" fill="#a4341f" text-anchor="middle">prove head(<tspan font-style="italic">L</tspan>) =&#160;<tspan font-style="italic">c</tspan></text>

  <line x1="238" y1="252" x2="91" y2="252" stroke="#a4341f" stroke-width="1.4" stroke-dasharray="4 2.5" marker-end="url(#aR)"/>
  <text x="164" y="247" font-size="11" fill="#a4341f" text-anchor="middle">proof 17.4 KB + instances [<tspan font-style="italic">L</tspan>,&#160;<tspan font-style="italic">c</tspan>]</text>
  <text x="248" y="266" font-size="10.5" fill="#6e6e6e">2.09 s, 2^15 rows, laptop CPU</text>

  <line x1="85" y1="278" x2="382" y2="278" stroke="#1c1c1c" stroke-width="1" marker-end="url(#a)"/>
  <text x="234" y="273" font-size="11" fill="#1c1c1c" text-anchor="middle">attest(decisionHash, shapHash,&#160;<tspan font-style="italic">c</tspan>,&#160;<tspan font-style="italic">L</tspan>, version, proof)</text>

  <line x1="388" y1="300" x2="532" y2="300" stroke="#1c1c1c" stroke-width="1" marker-end="url(#a)"/>
  <text x="460" y="295" font-size="11" fill="#1c1c1c" text-anchor="middle">verifyProof</text>
  <text x="546" y="304" font-size="10.5" fill="#6e6e6e">684,696 gas</text>

  <line x1="538" y1="322" x2="394" y2="322" stroke="#1c1c1c" stroke-width="1" stroke-dasharray="4 2.5" marker-end="url(#a)"/>
  <text x="466" y="317" font-size="11" fill="#1c1c1c" text-anchor="middle">true</text>

  <text x="394" y="344" font-size="11" fill="#a4341f">reverts if the proof does not verify &#183; total attest cost 887,376 gas</text>

  <line x1="388" y1="366" x2="91" y2="366" stroke="#1c1c1c" stroke-width="1" stroke-dasharray="4 2.5" marker-end="url(#a)"/>
  <text x="240" y="361" font-size="11" fill="#1c1c1c" text-anchor="middle">attestationId</text>

  <!-- ================= phase 3: dispute and resolve ================= -->
  <text x="26" y="398" font-size="10.5" fill="#6e6e6e" letter-spacing="0.5">DISPUTE AND RESOLVE</text>
  <line x1="26" y1="404" x2="1036" y2="404" stroke="#dcdcdc" stroke-width="0.7"/>

  <line x1="828" y1="422" x2="694" y2="422" stroke="#1c1c1c" stroke-width="1" marker-end="url(#a)"/>
  <text x="762" y="417" font-size="11" fill="#1c1c1c" text-anchor="middle">openDispute</text>
  <text x="836" y="426" font-size="10.5" fill="#6e6e6e">134,608 gas</text>

  <text x="26" y="446" font-size="11" fill="#1c1c1c">
    <tspan font-weight="bold">Closed since v0:</tspan>
    <tspan> withdrawal is now request/execute behind an unbonding delay, and an open dispute freezes execution,</tspan>
  </text>
  <text x="26" y="460" font-size="11" fill="#1c1c1c">so the operator can no longer front-run this step to zero out the slash (&#167;8.3). Two residual gaps remain.</text>

  <line x1="968" y1="484" x2="694" y2="484" stroke="#1c1c1c" stroke-width="1" marker-end="url(#a)"/>
  <text x="830" y="479" font-size="11" fill="#1c1c1c" text-anchor="middle">resolveDispute(id, upheld) &#183; N of M</text>
  <text x="26" y="488" font-size="11" fill="#a4341f">Tier 3: resolvers stake nothing, there is no evidentiary standard, and no appeal.</text>
  <text x="26" y="502" font-size="11" fill="#a4341f">N colluding members carry exactly the authority v0's single admin key had (&#167;8.2).</text>

  <path d="M 688 518 L 731 518 L 731 534 L 693 534" fill="none" stroke="#1c1c1c" stroke-width="1" marker-end="url(#a)"/>
  <text x="740" y="528" font-size="11" fill="#1c1c1c">slash = stake&#160;&#183;&#160;(<tspan font-style="italic">c</tspan>&#8722;<tspan font-style="italic">o</tspan>)&#178;, capped at 100%&#160;&#160;&#183;&#160;&#160;543 gas</text>

  <line x1="688" y1="554" x2="822" y2="554" stroke="#1c1c1c" stroke-width="1" marker-end="url(#a)"/>
  <text x="756" y="549" font-size="11" fill="#1c1c1c" text-anchor="middle">transfer(slash)</text>
  <text x="836" y="558" font-size="10.5" fill="#6e6e6e">resolve + payout 97,390 gas</text>

  <line x1="26" y1="574" x2="1036" y2="574" stroke="#1c1c1c" stroke-width="1"/>
  <text x="26" y="590" font-size="11.5" fill="#1c1c1c">
    <tspan font-weight="bold">Verification dominates.</tspan>
    <tspan> The Brier arithmetic that is the substance of the mechanism costs 543 gas &#8212; three orders of magnitude less than proving that it ran.</tspan>
  </text>
</svg>
