<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1060 640" width="1060" height="640" font-family="CMU Serif, Latin Modern Roman, Georgia, serif">
  <!--
    Figure C - trust tiers and what each one is worth.

    The previous version was section 8 typeset as coloured boxes: roughly 600
    words of prose, traffic-light fills, bold red throughout, and every claim
    duplicated from the body text. It read as decoration, and a reviewer would
    have skipped it.

    This version answers ONE question the prose cannot answer as compactly:
    for each tier, what has to be true for the guarantee to hold, and who can
    break it? That is a table, so it is drawn as one. Tier membership is shown
    by position and by rule weight rather than by fill colour, so the figure
    works in greyscale; the single red column is the adversary who defeats each
    tier, because that is the figure's actual content.
  -->
  <defs>
    <pattern id="hatch" width="5" height="5" patternTransform="rotate(45)" patternUnits="userSpaceOnUse">
      <rect width="5" height="5" fill="#ffffff"/>
      <line x1="0" y1="0" x2="0" y2="5" stroke="#a4341f" stroke-width="0.9" opacity="0.45"/>
    </pattern>
  </defs>

  <rect width="1060" height="640" fill="#ffffff"/>

  <!-- ================= column headers ================= -->
  <text x="24"  y="30" font-size="12" font-weight="bold" fill="#1c1c1c">Tier</text>
  <text x="150" y="30" font-size="12" font-weight="bold" fill="#1c1c1c">What it covers</text>
  <text x="470" y="30" font-size="12" font-weight="bold" fill="#1c1c1c">Rests on</text>
  <text x="700" y="30" font-size="12" font-weight="bold" fill="#a4341f">Who can break it</text>
  <text x="940" y="30" font-size="12" font-weight="bold" fill="#1c1c1c">Evidence</text>
  <line x1="24" y1="38" x2="1036" y2="38" stroke="#1c1c1c" stroke-width="1.1"/>

  <!-- ================= TIER 1 ================= -->
  <rect x="24" y="48" width="112" height="112" fill="url(#hatch)" stroke="#a4341f" stroke-width="1.6"/>
  <text x="34" y="70" font-size="13" font-weight="bold" fill="#1c1c1c">Tier 1</text>
  <text x="34" y="88" font-size="11.5" fill="#3a3a3a">cryptographic</text>
  <text x="34" y="104" font-size="11.5" fill="#3a3a3a">no trust</text>
  <text x="34" y="120" font-size="11.5" fill="#3a3a3a">required</text>

  <text x="150" y="66" font-size="11.5" fill="#1c1c1c">Execution of the calibration head:</text>
  <text x="150" y="82" font-size="11.5" fill="#3a3a3a">given a logit&#160;<tspan font-style="italic">L</tspan>, head(vk) maps it to the attested&#160;<tspan font-style="italic">c</tspan></text>
  <text x="150" y="102" font-size="11.5" fill="#1c1c1c">Slash arithmetic:</text>
  <text x="150" y="118" font-size="11.5" fill="#3a3a3a">slash is exactly stake&#183;(<tspan font-style="italic">c</tspan>&#8722;<tspan font-style="italic">o</tspan>)&#178;, capped, no overflow</text>
  <text x="150" y="138" font-size="11.5" fill="#3a3a3a">Conformal set construction (in-circuit)</text>

  <text x="470" y="66" font-size="11.5" fill="#3a3a3a">halo2/KZG soundness</text>
  <text x="470" y="82" font-size="11.5" fill="#3a3a3a">WAD fixed-point arithmetic</text>
  <text x="470" y="98" font-size="11.5" fill="#3a3a3a">with no unchecked blocks</text>

  <text x="700" y="66" font-size="11.5" font-weight="bold" fill="#a4341f">Nobody &#8212; for what it covers.</text>
  <text x="700" y="84" font-size="11.5" fill="#a4341f">But it does not cover the base</text>
  <text x="700" y="100" font-size="11.5" fill="#a4341f">model, the provenance of&#160;<tspan font-style="italic">L</tspan>, the</text>
  <text x="700" y="116" font-size="11.5" fill="#a4341f">applicant's features, the SHAP</text>
  <text x="700" y="132" font-size="11.5" fill="#a4341f">bundle, or the fitted constants.</text>
  <text x="700" y="150" font-size="11.5" font-weight="bold" fill="#a4341f">A fabricated&#160;<tspan font-style="italic">L</tspan> yields a valid proof.</text>

  <text x="940" y="66" font-size="10.5" fill="#6e6e6e">4/4 tamper</text>
  <text x="940" y="80" font-size="10.5" fill="#6e6e6e">checks reject</text>
  <text x="940" y="100" font-size="10.5" fill="#6e6e6e">properness</text>
  <text x="940" y="114" font-size="10.5" fill="#6e6e6e">fuzzed</text>
  <text x="940" y="134" font-size="10.5" fill="#6e6e6e">&#167;8.1</text>

  <line x1="24" y1="172" x2="1036" y2="172" stroke="#bfbfbf" stroke-width="0.7"/>

  <!-- ================= narrow band: content integrity ================= -->
  <rect x="24" y="182" width="112" height="52" fill="#ffffff" stroke="#1c1c1c" stroke-width="1"/>
  <text x="34" y="203" font-size="12" font-weight="bold" fill="#1c1c1c">Tier 1&#189;</text>
  <text x="34" y="220" font-size="11.5" fill="#3a3a3a">content only</text>

  <text x="150" y="200" font-size="11.5" fill="#1c1c1c">ModelRegistry: the artifact behind a version id</text>
  <text x="150" y="216" font-size="11.5" fill="#3a3a3a">hashes to the recorded value, so substitution is detectable</text>

  <text x="470" y="200" font-size="11.5" fill="#3a3a3a">collision resistance</text>

  <text x="700" y="200" font-size="11.5" fill="#a4341f">Anyone who trains dishonestly</text>
  <text x="700" y="216" font-size="11.5" fill="#a4341f">and registers the result truthfully.</text>

  <text x="940" y="200" font-size="10.5" fill="#6e6e6e">poisoned model</text>
  <text x="940" y="214" font-size="10.5" fill="#6e6e6e">registers cleanly</text>

  <line x1="24" y1="246" x2="1036" y2="246" stroke="#bfbfbf" stroke-width="0.7"/>

  <!-- ================= TIER 2 ================= -->
  <rect x="24" y="256" width="112" height="112" fill="#ffffff" stroke="#1c1c1c" stroke-width="1.4"/>
  <text x="34" y="278" font-size="13" font-weight="bold" fill="#1c1c1c">Tier 2</text>
  <text x="34" y="296" font-size="11.5" fill="#3a3a3a">economic</text>
  <text x="34" y="312" font-size="11.5" fill="#3a3a3a">holds if the</text>
  <text x="34" y="328" font-size="11.5" fill="#3a3a3a">operator is</text>
  <text x="34" y="344" font-size="11.5" fill="#3a3a3a">rational</text>

  <text x="150" y="274" font-size="11.5" fill="#1c1c1c">Honest confidence reporting:</text>
  <text x="150" y="290" font-size="11.5" fill="#3a3a3a">Brier is strictly proper, so E[slash] is minimised at&#160;<tspan font-style="italic">c</tspan>&#160;=&#160;<tspan font-style="italic">p</tspan></text>
  <text x="150" y="310" font-size="11.5" fill="#1c1c1c">Stake is present when the slash lands:</text>
  <text x="150" y="326" font-size="11.5" fill="#3a3a3a">two-step withdrawal behind an unbonding delay;</text>
  <text x="150" y="342" font-size="11.5" fill="#3a3a3a">any open dispute freezes execution</text>

  <text x="470" y="274" font-size="11.5" fill="#3a3a3a">the payoff structure, and</text>
  <text x="470" y="290" font-size="11.5" fill="#3a3a3a">dispute selection being</text>
  <text x="470" y="306" font-size="11.5" fill="#3a3a3a">independent of&#160;<tspan font-style="italic">c</tspan></text>
  <text x="470" y="326" font-size="11.5" fill="#3a3a3a">enforcement in code</text>
  <text x="470" y="342" font-size="11.5" fill="#3a3a3a">(shipped, Phase 3a)</text>

  <text x="700" y="274" font-size="11.5" fill="#a4341f">An operator never disputed inside</text>
  <text x="700" y="290" font-size="11.5" fill="#a4341f">the window: it exits intact. That is</text>
  <text x="700" y="306" font-size="11.5" fill="#a4341f">a bound on the dispute window,</text>
  <text x="700" y="322" font-size="11.5" fill="#a4341f">not on the lock.</text>
  <text x="700" y="342" font-size="11.5" font-weight="bold" fill="#a4341f">Also: tier 2 is released by tier 3.</text>

  <text x="940" y="274" font-size="10.5" fill="#6e6e6e">honesty is</text>
  <text x="940" y="288" font-size="10.5" fill="#6e6e6e">optimal (test)</text>
  <text x="940" y="308" font-size="10.5" fill="#6e6e6e">front-run now</text>
  <text x="940" y="322" font-size="10.5" fill="#6e6e6e">blocked (test)</text>
  <text x="940" y="342" font-size="10.5" fill="#6e6e6e">&#167;8.3</text>

  <line x1="24" y1="380" x2="1036" y2="380" stroke="#bfbfbf" stroke-width="0.7"/>

  <!-- ================= TIER 3 ================= -->
  <rect x="24" y="390" width="112" height="112" fill="#ffffff" stroke="#1c1c1c" stroke-width="1.4" stroke-dasharray="5 3"/>
  <text x="34" y="412" font-size="13" font-weight="bold" fill="#1c1c1c">Tier 3</text>
  <text x="34" y="430" font-size="11.5" fill="#3a3a3a">bounded</text>
  <text x="34" y="446" font-size="11.5" fill="#3a3a3a">trust</text>
  <text x="34" y="466" font-size="11.5" fill="#a4341f">no crypto,</text>
  <text x="34" y="482" font-size="11.5" fill="#a4341f">no economics</text>

  <text x="150" y="408" font-size="11.5" fill="#1c1c1c">Who loses money: the dispute outcome</text>
  <text x="150" y="428" font-size="11.5" fill="#1c1c1c">Ground truth for a rejection</text>
  <text x="150" y="444" font-size="11.5" fill="#3a3a3a">&#8212; a rejected applicant never demonstrates repayment,</text>
  <text x="150" y="460" font-size="11.5" fill="#3a3a3a">so &#8220;the decision was wrong&#8221; has no on-chain referent</text>
  <text x="150" y="480" font-size="11.5" fill="#1c1c1c">Operator reputation (EMA of realised Brier)</text>

  <text x="470" y="408" font-size="11.5" fill="#3a3a3a">an N-of-M committee,</text>
  <text x="470" y="424" font-size="11.5" fill="#3a3a3a">appointed and replaceable</text>
  <text x="470" y="440" font-size="11.5" fill="#3a3a3a">by the admin; resolvers</text>
  <text x="470" y="456" font-size="11.5" fill="#3a3a3a">stake nothing, and there is</text>
  <text x="470" y="472" font-size="11.5" fill="#3a3a3a">no evidentiary standard</text>
  <text x="470" y="488" font-size="11.5" fill="#3a3a3a">and no appeal</text>

  <text x="700" y="408" font-size="11.5" font-weight="bold" fill="#a4341f">Any N colluding members.</text>
  <text x="700" y="426" font-size="11.5" fill="#a4341f">That is exactly the authority v0's</text>
  <text x="700" y="442" font-size="11.5" fill="#a4341f">single admin key had; N-of-M</text>
  <text x="700" y="458" font-size="11.5" fill="#a4341f">raises the cost of collusion, it</text>
  <text x="700" y="474" font-size="11.5" fill="#a4341f">does not remove the capability.</text>
  <text x="700" y="492" font-size="11.5" fill="#a4341f">Reputation inherits this exactly.</text>

  <text x="940" y="408" font-size="10.5" fill="#6e6e6e">N-of-M = v0</text>
  <text x="940" y="422" font-size="10.5" fill="#6e6e6e">admin (test)</text>
  <text x="940" y="442" font-size="10.5" fill="#6e6e6e">committee can</text>
  <text x="940" y="456" font-size="10.5" fill="#6e6e6e">manufacture a</text>
  <text x="940" y="470" font-size="10.5" fill="#6e6e6e">score (test)</text>
  <text x="940" y="490" font-size="10.5" fill="#6e6e6e">&#167;8.2</text>

  <line x1="24" y1="514" x2="1036" y2="514" stroke="#bfbfbf" stroke-width="0.7"/>

  <!-- ================= below tier 3 ================= -->
  <rect x="24" y="524" width="112" height="66" fill="#ffffff" stroke="#a4341f" stroke-width="1" stroke-dasharray="5 3"/>
  <text x="34" y="546" font-size="12" font-weight="bold" fill="#a4341f">Below</text>
  <text x="34" y="562" font-size="12" font-weight="bold" fill="#a4341f">tier 3</text>
  <text x="34" y="580" font-size="11.5" fill="#a4341f">one key</text>

  <text x="150" y="542" font-size="11.5" fill="#1c1c1c">CollusionOracle: an enforced flag blocks the claimant</text>
  <text x="150" y="558" font-size="11.5" fill="#3a3a3a">from disputing and quarantines their payout. It cannot slash,</text>
  <text x="150" y="574" font-size="11.5" fill="#3a3a3a">and quarantined funds are refunded in full when cleared.</text>

  <text x="470" y="542" font-size="11.5" fill="#3a3a3a">a single reporter key</text>
  <text x="470" y="558" font-size="11.5" fill="#3a3a3a">relaying a GNN whose</text>
  <text x="470" y="574" font-size="11.5" fill="#3a3a3a">FPR on real traffic</text>
  <text x="470" y="590" font-size="11.5" fill="#3a3a3a">has never been measured</text>

  <text x="700" y="542" font-size="11.5" font-weight="bold" fill="#a4341f">Whoever holds that one key.</text>
  <text x="700" y="560" font-size="11.5" fill="#a4341f">Thinner than tier 3: the committee</text>
  <text x="700" y="576" font-size="11.5" fill="#a4341f">needs N signatures, this needs one.</text>
  <text x="700" y="594" font-size="11.5" fill="#a4341f">A false positive silences an honest</text>
  <text x="700" y="610" font-size="11.5" fill="#a4341f">claimant, protecting a bad decision.</text>

  <text x="940" y="542" font-size="10.5" fill="#6e6e6e">0.94% FPR at</text>
  <text x="940" y="556" font-size="10.5" fill="#6e6e6e">the enforced</text>
  <text x="940" y="570" font-size="10.5" fill="#6e6e6e">threshold; FDR</text>
  <text x="940" y="584" font-size="10.5" fill="#6e6e6e">19.9% at best</text>
  <text x="940" y="604" font-size="10.5" fill="#6e6e6e">&#167;8.5</text>

  <line x1="24" y1="622" x2="1036" y2="622" stroke="#1c1c1c" stroke-width="1.1"/>
  <text x="24" y="636" font-size="11.5" fill="#1c1c1c">
    <tspan font-weight="bold">The cheapest attack today requires breaking no cryptography:</tspan>
    <tspan> attest over a fabricated&#160;</tspan><tspan font-style="italic">L</tspan><tspan>, or corrupt N committee members, or compromise the single reporter key.</tspan>
  </text>
</svg>
