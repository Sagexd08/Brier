<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1060 604" width="1060" height="604" font-family="CMU Serif, Latin Modern Roman, Georgia, serif">
  <!--
    Figure A - component architecture.

    Redrawn to read as a paper figure rather than a slide. Four changes, each
    for a reason:

    1. No title inside the figure. The caption below it already names the
       figure; printing the name twice, at two sizes, in two typefaces is the
       single strongest "pasted in from a deck" signal.
    2. Computer Modern, matching the paper body.
    3. Colour is redundant. Membership of the proved subgraph is carried by a
       HATCHED fill and a heavy rule, not by hue, so the figure survives
       greyscale printing. The one saturated element in the drawing is the
       unproved-input arrow, because that is the paper's central negative
       result and is the only thing that should draw the eye.
    4. Prose removed. The old version carried a 60-word paragraph explaining
       the trust gap, duplicating section 8.1. A figure that has to be read as
       text is not doing a figure's job; the gap is now one labelled arrow.
  -->
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9.2" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.2 L 9 5 L 0 8.8 z" fill="#1c1c1c"/>
    </marker>
    <marker id="arRed" viewBox="0 0 10 10" refX="9.2" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M 0 1.2 L 9 5 L 0 8.8 z" fill="#a4341f"/>
    </marker>
    <pattern id="proved" width="6" height="6" patternTransform="rotate(45)" patternUnits="userSpaceOnUse">
      <rect width="6" height="6" fill="#ffffff"/>
      <line x1="0" y1="0" x2="0" y2="6" stroke="#a4341f" stroke-width="1.1" opacity="0.55"/>
    </pattern>
  </defs>

  <rect width="1060" height="604" fill="#ffffff"/>

  <!-- ================= legend, top right ================= -->
  <g font-size="11.5" fill="#1c1c1c">
    <rect x="742" y="14" width="15" height="11" fill="url(#proved)" stroke="#a4341f" stroke-width="1.6"/>
    <text x="764" y="23.5">inside the zk circuit</text>
    <rect x="742" y="33" width="15" height="11" fill="#ffffff" stroke="#1c1c1c" stroke-width="1"/>
    <text x="764" y="42.5">implemented, not proved</text>
    <rect x="742" y="52" width="15" height="11" fill="#ffffff" stroke="#8a8a8a" stroke-width="1" stroke-dasharray="3 2.5"/>
    <text x="764" y="61.5">specified, not built</text>
  </g>

  <!-- ================= OFF-CHAIN ================= -->
  <line x1="24" y1="88" x2="620" y2="88" stroke="#bfbfbf" stroke-width="0.8"/>
  <text x="24" y="80" font-size="12" fill="#6e6e6e" letter-spacing="0.6">OFF-CHAIN &#8212; model operator</text>

  <!-- base classifier -->
  <rect x="24" y="104" width="182" height="72" fill="#ffffff" stroke="#1c1c1c" stroke-width="1"/>
  <text x="34" y="124" font-size="13" font-weight="bold" fill="#1c1c1c">Base classifier</text>
  <text x="34" y="141" font-size="11.5" fill="#3a3a3a">XGBoost, depth 8, 400 trees</text>
  <text x="34" y="156" font-size="11.5" fill="#3a3a3a">19 features, UCI German Credit</text>
  <text x="34" y="171" font-size="11.5" fill="#a4341f">not in the circuit</text>

  <!-- calibration head: the only proved component -->
  <rect x="262" y="104" width="182" height="72" fill="url(#proved)" stroke="#a4341f" stroke-width="1.8"/>
  <text x="272" y="124" font-size="13" font-weight="bold" fill="#1c1c1c">Calibration head</text>
  <text x="272" y="141" font-size="11.5" fill="#3a3a3a">temperature, 1 param, T = 3.01</text>
  <text x="272" y="156" font-size="11.5" fill="#3a3a3a">or MLP 1-16-16-1, 321 params</text>
  <text x="272" y="171" font-size="11.5" font-weight="bold" fill="#a4341f">the only proved component</text>

  <!-- SHAP -->
  <rect x="500" y="104" width="120" height="72" fill="#ffffff" stroke="#1c1c1c" stroke-width="1"/>
  <text x="510" y="124" font-size="13" font-weight="bold" fill="#1c1c1c">SHAP</text>
  <text x="510" y="141" font-size="11.5" fill="#3a3a3a">TreeExplainer</text>
  <text x="510" y="156" font-size="11.5" fill="#3a3a3a">top 5, hashed</text>
  <text x="510" y="171" font-size="11.5" fill="#a4341f">evidence only</text>

  <!-- THE unproved input. The one saturated element in the figure. -->
  <line x1="206" y1="140" x2="258" y2="140" stroke="#a4341f" stroke-width="2.2" marker-end="url(#arRed)"/>
  <text x="232" y="132" font-size="11.5" font-weight="bold" fill="#a4341f" text-anchor="middle">logit L</text>
  <text x="232" y="194" font-size="11" fill="#a4341f" text-anchor="middle">unverified</text>
  <text x="232" y="208" font-size="11" fill="#a4341f" text-anchor="middle">public input</text>

  <line x1="444" y1="140" x2="496" y2="140" stroke="#1c1c1c" stroke-width="1" marker-end="url(#ar)"/>
  <text x="470" y="133" font-size="11" fill="#3a3a3a" text-anchor="middle">c</text>

  <!-- prover -->
  <rect x="262" y="242" width="182" height="72" fill="url(#proved)" stroke="#a4341f" stroke-width="1.8"/>
  <text x="272" y="262" font-size="13" font-weight="bold" fill="#1c1c1c">EZKL prover (halo2)</text>
  <text x="272" y="279" font-size="11.5" fill="#3a3a3a">2^15 = 32,768 rows</text>
  <text x="272" y="294" font-size="11.5" fill="#3a3a3a">2.09 s &#183; proof 17.4 KB</text>
  <text x="272" y="309" font-size="11.5" fill="#3a3a3a">proving key 132 MiB</text>
  <line x1="353" y1="176" x2="353" y2="238" stroke="#1c1c1c" stroke-width="1" marker-end="url(#ar)"/>
  <text x="360" y="212" font-size="11" fill="#3a3a3a">head weights + L</text>

  <!-- claimant -->
  <rect x="24" y="242" width="182" height="72" fill="#ffffff" stroke="#1c1c1c" stroke-width="1"/>
  <text x="34" y="262" font-size="13" font-weight="bold" fill="#1c1c1c">Claimant</text>
  <text x="34" y="279" font-size="11.5" fill="#3a3a3a">opens a dispute: 134,608 gas</text>
  <text x="34" y="294" font-size="11.5" fill="#3a3a3a">receives the slashed amount</text>

  <!-- ================= ON-CHAIN ================= -->
  <line x1="676" y1="88" x2="1036" y2="88" stroke="#bfbfbf" stroke-width="0.8"/>
  <text x="676" y="80" font-size="12" fill="#6e6e6e" letter-spacing="0.6">ON-CHAIN &#8212; local Anvil devnet</text>

  <rect x="676" y="104" width="360" height="60" fill="#ffffff" stroke="#1c1c1c" stroke-width="1"/>
  <text x="686" y="124" font-size="13" font-weight="bold" fill="#1c1c1c">Halo2Verifier.sol</text>
  <text x="686" y="141" font-size="11.5" fill="#3a3a3a">EZKL-generated &#183; deploy 2,942,192 gas</text>
  <text x="686" y="156" font-size="11.5" fill="#3a3a3a">verifyProof 684,696 gas</text>

  <rect x="676" y="180" width="360" height="72" fill="#ffffff" stroke="#1c1c1c" stroke-width="1"/>
  <text x="686" y="200" font-size="13" font-weight="bold" fill="#1c1c1c">Attestation.sol</text>
  <text x="686" y="217" font-size="11.5" fill="#3a3a3a">decisionHash &#183; shapHash &#183; confidence &#183; margin</text>
  <text x="686" y="232" font-size="11.5" fill="#3a3a3a">attest + verify: 887,376 gas</text>
  <text x="686" y="247" font-size="11.5" fill="#a4341f">reverts if the proof does not verify</text>

  <rect x="676" y="268" width="360" height="72" fill="#ffffff" stroke="#1c1c1c" stroke-width="1"/>
  <text x="686" y="288" font-size="13" font-weight="bold" fill="#1c1c1c">StakePool.sol + BrierMath.sol</text>
  <text x="686" y="305" font-size="11.5" fill="#3a3a3a">slash = stake &#183; (c &#8722; o)&#178;, capped at 100%</text>
  <text x="686" y="320" font-size="11.5" fill="#3a3a3a">slashAmount 543 gas &#183; resolve + payout 97,390</text>
  <text x="686" y="335" font-size="11.5" fill="#3a3a3a">unbonding delay + dispute freeze</text>

  <rect x="676" y="356" width="360" height="56" fill="#ffffff" stroke="#1c1c1c" stroke-width="1"/>
  <text x="686" y="376" font-size="13" font-weight="bold" fill="#1c1c1c">Dispute resolver &#8212; N-of-M committee</text>
  <text x="686" y="393" font-size="11.5" fill="#3a3a3a">threshold &#8805; 2 &#183; admin-appointed</text>
  <text x="686" y="408" font-size="11.5" fill="#a4341f">N colluding members = v0's single admin key</text>

  <rect x="676" y="428" width="360" height="42" fill="#ffffff" stroke="#1c1c1c" stroke-width="1"/>
  <text x="686" y="448" font-size="13" font-weight="bold" fill="#1c1c1c">ReputationRegister &#183; ModelRegistry</text>
  <text x="686" y="463" font-size="11.5" fill="#3a3a3a">EMA of realised Brier &#183; content-addressed versions</text>

  <rect x="676" y="486" width="360" height="42" fill="#ffffff" stroke="#1c1c1c" stroke-width="1"/>
  <text x="686" y="506" font-size="13" font-weight="bold" fill="#1c1c1c">CollusionOracle</text>
  <text x="686" y="521" font-size="11.5" fill="#a4341f">unvalidated: blocks disputes, quarantines payouts, cannot slash</text>

  <rect x="676" y="544" width="360" height="38" fill="#ffffff" stroke="#8a8a8a" stroke-width="1" stroke-dasharray="3 2.5"/>
  <text x="686" y="563" font-size="13" font-weight="bold" fill="#6e6e6e">Staked jury with appeals</text>
  <text x="686" y="577" font-size="11.5" fill="#6e6e6e">specified in &#167;9.2, not built</text>

  <!-- ================= crossings ================= -->
  <path d="M 444 278 L 632 278 L 632 200 L 672 200" fill="none" stroke="#1c1c1c" stroke-width="1" marker-end="url(#ar)"/>
  <text x="470" y="272" font-size="11" fill="#3a3a3a">proof + public instances</text>

  <path d="M 560 176 L 560 206 L 652 206 L 652 232 L 672 232" fill="none" stroke="#1c1c1c" stroke-width="1" marker-end="url(#ar)"/>
  <text x="566" y="200" font-size="11" fill="#3a3a3a">SHAP hash</text>

  <path d="M 206 278 L 236 278 L 236 384 L 672 384" fill="none" stroke="#1c1c1c" stroke-width="1" marker-end="url(#ar)"/>
  <text x="300" y="378" font-size="11" fill="#3a3a3a">openDispute(attestationId)</text>

  <path d="M 856 252 L 856 264" fill="none" stroke="#1c1c1c" stroke-width="1" marker-end="url(#ar)"/>
  <path d="M 856 340 L 856 352" fill="none" stroke="#1c1c1c" stroke-width="1" marker-end="url(#ar)"/>
  <path d="M 856 412 L 856 424" fill="none" stroke="#1c1c1c" stroke-width="1" marker-end="url(#ar)"/>
  <path d="M 856 176 L 856 164" fill="none" stroke="#1c1c1c" stroke-width="1" marker-end="url(#ar)"/>
  <text x="864" y="174" font-size="10.5" fill="#3a3a3a">calls</text>

  <!-- The trust gap, as one line rather than a paragraph. -->
  <line x1="24" y1="356" x2="620" y2="356" stroke="#bfbfbf" stroke-width="0.8" stroke-dasharray="2 3"/>
  <text x="24" y="500" font-size="11.5" fill="#6e6e6e">
    <tspan font-weight="bold">Reading order.</tspan>
    <tspan x="24" dy="16">A decision is scored, the head maps its logit to a confidence,</tspan>
    <tspan x="24" dy="15">the prover attests that mapping, and the chain stores it. Money</tspan>
    <tspan x="24" dy="15">moves only when a claimant disputes and the committee resolves.</tspan>
  </text>
  <text x="24" y="420" font-size="12" fill="#1c1c1c">
    <tspan font-weight="bold" fill="#a4341f">The proof binds the hatched region only.</tspan>
    <tspan x="24" dy="17">An operator that fabricates</tspan>
    <tspan font-style="italic"> L</tspan>
    <tspan> obtains a proof that verifies and a chain that accepts it,</tspan>
    <tspan x="24" dy="17">because nothing ties</tspan>
    <tspan font-style="italic"> L</tspan>
    <tspan> to the classifier above it or to the applicant's real features.</tspan>
    <tspan x="24" dy="17">See &#167;8.1 and Figure C, tier 1.</tspan>
  </text>
</svg>
