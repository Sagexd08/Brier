[package]
name = "brier"
version = "0.1.0"
description = "Confidence-calibrated slashing for on-chain AI decision accountability (Solana port)"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "brier"

[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
idl-build = ["anchor-lang/idl-build"]

[dependencies]
# `init-if-needed` is opt-in because it enables re-initialisation attacks if
# used carelessly. Used ONLY for the stake account, whose initialiser is the
# operator itself and whose fields are additive (bonded += amount), so a repeat
# init cannot reset another party's balance. Phase 3 attacks this directly.
anchor-lang = { version = "0.31.1", features = ["init-if-needed"] }
