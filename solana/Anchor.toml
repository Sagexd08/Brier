[toolchain]
anchor_version = "0.31.1"
solana_version = "2.1.0"   # matches solanafoundation/anchor:v0.31.1

[features]
resolution = true
skip-lint = false

[programs.localnet]
brier = "BrieR111111111111111111111111111111111111111"

[registry]
url = "https://api.apr.dev"

[provider]
cluster = "Localnet"
wallet = "~/.config/solana/id.json"

[scripts]
test = "yarn run ts-mocha -p ./tsconfig.json -t 1000000 tests/**/*.ts"
